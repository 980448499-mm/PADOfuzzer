logger:
  file:
    path: /var/log/open5gs/nrf.log
  level: info

nrf:
  serving:
    - plmn_id:
        mcc: 001
        mnc: 01
  sbi:
    server:
      - address: 0.0.0.0
        port: 7777
    client:
      nrf:
        - uri: http://172.23.0.10:7777

