# Open5GS 5G Core deployment for fuzzing
# Based on Open5GS v2.7.6 with coverage instrumentation support
#
# Network: 172.23.0.0/24 (fuzzing-open5gs)
#
# NF service map:
#   NRF  - 172.23.0.10:7777  (Service Registry)
#   AMF  - 172.23.0.20:7777  (Access & Mobility, SCTP:38412)
#   SMF  - 172.23.0.30:7777  (Session Management, PFCP:8805)
#   UPF  - 172.23.0.40:8805  (User Plane, GTP-U:2152)
#   AUSF - 172.23.0.50:7777  (Authentication Server)
#   UDM  - 172.23.0.60:7777  (Unified Data Management)
#   UDR  - 172.23.0.70:7777  (Unified Data Repository)
#   PCF  - 172.23.0.80:7777  (Policy Control)
#   NSSF - 172.23.0.90:7777  (Network Slice Selection)
#   BSF  - 172.23.0.100:7777 (Binding Support)
#   SCP  - 172.23.0.110:7777 (Service Communication Proxy)
#   MongoDB - 172.23.0.120:27017 (Subscriber DB)

version: "3.8"

x-open5gs-common: &open5gs-common
  image: open5gs-fuzz:v2.7.7
  restart: always
  entrypoint: []
  networks:
    fuzzing-open5gs:

  volumes:
    - ./logs:/var/log/open5gs
  logging:
    driver: "json-file"
    options:
      max-size: "100m"
      max-file: "3"

services:
  # ─── Database ───
  mongodb:
    image: mongo:7.0
    container_name: fuzzing-open5gs-mongodb
    networks:
      fuzzing-open5gs:
        ipv4_address: 172.23.0.120
    volumes:
      - mongodb_data:/data/db
    command: ["mongod", "--bind_ip", "0.0.0.0", "--wiredTigerCacheSizeGB", "0.25"]

  # ─── Service Registry ───
  nrf:
    <<: *open5gs-common
    container_name: fuzzing-open5gs-nrf
    networks:
      fuzzing-open5gs:
        ipv4_address: 172.23.0.10
    depends_on:
      - mongodb
    volumes:
      - ./configs/nrf.yaml:/etc/open5gs/nrf.yaml:ro
    command: ["sh", "-c", "mkdir -p /var/log/open5gs && /usr/bin/open5gs-nrfd -c /etc/open5gs/nrf.yaml"]
    # ports:
      # - "port"

  # ─── Core Network Functions ───
  amf:
    <<: *open5gs-common
    # AMF is the NAS-MM fuzzing target. Override with the sanitizer build via
    #   AMF_IMAGE=open5gs-fuzz:v2.7.7-asan docker compose up -d
    # Defaults to the regular image so the normal workflow is unaffected.
    image: ${AMF_IMAGE:-open5gs-fuzz:v2.7.7}
    container_name: fuzzing-open5gs-amf
    networks:
      fuzzing-open5gs:
        ipv4_address: 172.23.0.20
    depends_on:
      - nrf
    volumes:
      - ./configs/amf.yaml:/etc/open5gs/amf.yaml:ro
    command: ["sh", "-c", "mkdir -p /var/log/open5gs && /usr/bin/open5gs-amfd -c /etc/open5gs/amf.yaml"]
    # ports:
      # - "port"  # N2 interface (NGAP over SCTP)
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN

  smf:
    <<: *open5gs-common
    # SMF is the NAS-SM fuzzing target. Override with the sanitizer build via
    #   SMF_IMAGE=open5gs-fuzz:v2.7.7-asan docker compose up -d
    # Defaults to the regular image so the normal workflow is unaffected.
    image: ${SMF_IMAGE:-open5gs-fuzz:v2.7.7}
    container_name: fuzzing-open5gs-smf
    networks:
      fuzzing-open5gs:
        ipv4_address: 172.23.0.30
    depends_on:
      - nrf
      - upf
    volumes:
      - ./configs/smf.yaml:/etc/open5gs/smf.yaml:ro
    command: ["sh", "-c", "mkdir -p /var/log/open5gs && /usr/bin/open5gs-smfd -c /etc/open5gs/smf.yaml"]

  upf:
    <<: *open5gs-common
    container_name: fuzzing-open5gs-upf
    networks:
      fuzzing-open5gs:
        ipv4_address: 172.23.0.40
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    volumes:
      - ./configs/upf.yaml:/etc/open5gs/upf.yaml:ro
    command: ["sh", "-c", "mkdir -p /var/log/open5gs && /usr/bin/open5gs-upfd -c /etc/open5gs/upf.yaml"]
    devices:
      - /dev/net/tun:/dev/net/tun
    # ports:
      # - "port"  # N3 interface (GTP-U)
      # - "port"  # N4 interface (PFCP)

  ausf:
    <<: *open5gs-common
    container_name: fuzzing-open5gs-ausf
    networks:
      fuzzing-open5gs:
        ipv4_address: 172.23.0.50
    depends_on:
      - nrf
    volumes:
      - ./configs/ausf.yaml:/etc/open5gs/ausf.yaml:ro
    command: ["sh", "-c", "mkdir -p /var/log/open5gs && /usr/bin/open5gs-ausfd -c /etc/open5gs/ausf.yaml"]

  udm:
    <<: *open5gs-common
    container_name: fuzzing-open5gs-udm
    networks:
      fuzzing-open5gs:
        ipv4_address: 172.23.0.60
    depends_on:
      - nrf
    volumes:
      - ./configs/udm.yaml:/etc/open5gs/udm.yaml:ro
    command: ["sh", "-c", "mkdir -p /var/log/open5gs && /usr/bin/open5gs-udmd -c /etc/open5gs/udm.yaml"]

  udr:
    <<: *open5gs-common
    container_name: fuzzing-open5gs-udr
    networks:
      fuzzing-open5gs:
        ipv4_address: 172.23.0.70
    depends_on:
      - nrf
    volumes:
      - ./configs/udr.yaml:/etc/open5gs/udr.yaml:ro
    command: ["sh", "-c", "mkdir -p /var/log/open5gs && /usr/bin/open5gs-udrd -c /etc/open5gs/udr.yaml"]

  pcf:
    <<: *open5gs-common
    container_name: fuzzing-open5gs-pcf
    networks:
      fuzzing-open5gs:
        ipv4_address: 172.23.0.80
    depends_on:
      - nrf
    volumes:
      - ./configs/pcf.yaml:/etc/open5gs/pcf.yaml:ro
    command: ["sh", "-c", "mkdir -p /var/log/open5gs && /usr/bin/open5gs-pcfd -c /etc/open5gs/pcf.yaml"]

  nssf:
    <<: *open5gs-common
    container_name: fuzzing-open5gs-nssf
    networks:
      fuzzing-open5gs:
        ipv4_address: 172.23.0.90
    depends_on:
      - nrf
    volumes:
      - ./configs/nssf.yaml:/etc/open5gs/nssf.yaml:ro
    command: ["sh", "-c", "mkdir -p /var/log/open5gs && /usr/bin/open5gs-nssfd -c /etc/open5gs/nssf.yaml"]

  bsf:
    <<: *open5gs-common
    container_name: fuzzing-open5gs-bsf
    networks:
      fuzzing-open5gs:
        ipv4_address: 172.23.0.100
    depends_on:
      - nrf
    volumes:
      - ./configs/bsf.yaml:/etc/open5gs/bsf.yaml:ro
    command: ["sh", "-c", "mkdir -p /var/log/open5gs && /usr/bin/open5gs-bsfd -c /etc/open5gs/bsf.yaml"]

  scp:
    <<: *open5gs-common
    container_name: fuzzing-open5gs-scp
    networks:
      fuzzing-open5gs:
        ipv4_address: 172.23.0.110
    depends_on:
      - nrf
    volumes:
      - ./configs/scp.yaml:/etc/open5gs/scp.yaml:ro
    command: ["sh", "-c", "mkdir -p /var/log/open5gs && /usr/bin/open5gs-scpd -c /etc/open5gs/scp.yaml"]

networks:
  fuzzing-open5gs:
    name: fuzzing-open5gs_fuzzing-open5gs
    external: true
    ipam:
      config:
        - subnet: 172.23.0.0/24
    driver_opts:
      com.docker.network.bridge.name: br-c5159336d718

volumes:
  mongodb_data:
