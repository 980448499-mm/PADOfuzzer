############# OAI 5G Core - Fuzzing Config (v2.2.0 format)
# Adapted for fuzzing network 172.25.0.0/24

log_level:
  general: debug

register_nf:
  general: yes

http_version: 2

nfs:
  amf:
    host: 172.25.0.20
    sbi:
      port: 80
      api_version: v1
      interface_name: eth0
    n2:
      interface_name: eth0
      port: 38412
  smf:
    host: 172.25.0.30
    sbi:
      port: 80
      api_version: v1
      interface_name: eth0
    n4:
      interface_name: eth0
      port: 8805
  udm:
    host: 172.25.0.60
    sbi:
      port: 80
      api_version: v1
      interface_name: eth0
  udr:
    host: 172.25.0.70
    sbi:
      port: 80
      api_version: v1
      interface_name: eth0
  ausf:
    host: 172.25.0.50
    sbi:
      port: 80
      api_version: v1
      interface_name: eth0
  nrf:
    host: 172.25.0.10
    sbi:
      port: 80
      api_version: v1
      interface_name: eth0

database:
  host: 172.25.0.120
  user: test
  type: mysql
  password: test
  database_name: oai_db
  connection_timeout: 300

amf:
  amf_name: "OAI-AMF"
  support_features_options:
    enable_simple_scenario: no
    enable_nssf: no
    enable_smf_selection: yes
  relative_capacity: 30
  statistics_timer_interval: 20
  emergency_support: false
  served_guami_list:
    - mcc: 001
      mnc: 01
      amf_region_id: 01
      amf_set_id: 001
      amf_pointer: 01
  plmn_support_list:
    - mcc: 001
      mnc: 01
      tac: 0x0001
      nssai:
        - sst: 1
  supported_integrity_algorithms:
    - "NIA0"
    - "NIA1"
    - "NIA2"
  supported_encryption_algorithms:
    - "NEA0"
    - "NEA1"
    - "NEA2"

smf:
  ue_mtu: 1500
  support_features:
    use_local_subscription_info: yes
    use_local_pcc_rules: yes
  upfs:
    - host: 172.25.0.80
      config:
        enable_usage_reporting: no
  ue_dns:
    primary_ipv4: "8.8.8.8"
    primary_ipv6: "2001:4860:4860::8888"
    secondary_ipv4: "8.8.4.4"
    secondary_ipv6: "2001:4860:4860::8844"
  ims:
    pcscf_ipv4: "127.0.0.1"
    pcscf_ipv6: "fe80::1"
  local_subscription_infos:
    - single_nssai:
        sst: 1
      dnn: "oai"
      qos_profile:
        5qi: 9
        session_ambr_ul: "200Mbps"
        session_ambr_dl: "400Mbps"

dnns:
  - dnn: "oai"
    pdu_session_type: "IPV4"
    ipv4_pool: "12.1.1.2 - 12.1.1.253"
