# OAI 5GC SMF Configuration for Fuzzing
# N4 interface (PFCP) for UPF control

server:
  bind_address: 172.25.0.30
  sbi_port: 8080

nrf:
  address: 172.25.0.10
  port: 80

pfcp:
  bind_address: 172.25.0.30
  port: 8805

upf:
  - id: UPF-default
    address: 172.25.0.40
    pfcp_port: 8805

dnn:
  - name: internet
    type: IPv4
    ipv4_pool: 10.60.0.0/16

slice:
  - sst: 1
    sd: "010203"
    dnn_list: [ internet ]

database:
  host: 172.25.0.120
  port: 3306
  user: root
  password: oai_password
  db: oai_db
