# OAI 5GC AMF Configuration for Fuzzing
# N2 interface (NGAP/SCTP) for gNB/UE communication

server:
  bind_address: 172.25.0.20
  sbi_port: 8080

nrf:
  address: 172.25.0.10
  port: 80

ngap:
  bind_address: 172.25.0.20
  port: 38412
  sctp: yes

plmn:
  mcc: "001"
  mnc: "01"
  tac: "000001"

slice:
  - sst: 1
    sd: "010203"

security:
  integrity_order: [ NIA2, NIA1, NIA0 ]
  ciphering_order: [ NEA0, NEA2, NEA1 ]

database:
  host: 172.25.0.120
  port: 3306
  user: root
  password: oai_password
  db: oai_db
